name: faseeh_kids
description: "فصيح الصغار - تطبيق تعليم اللغة العربية للأطفال | Arabic Language Learning App for Kids"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── Core State Management (P0-T005) ───
  flutter_riverpod: ^2.4.9

  # ─── Local Database (P0-T006) ───
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── Navigation (P0-T007) ───
  go_router: ^13.1.0

  # ─── Audio (P0-T008) ───
  audioplayers: ^5.2.1

  # ─── Typography (P0-T009) ───
  google_fonts: ^6.2.1

  # ─── Animations (P0-T010) ───
  flutter_animate: ^4.2.0

  # ─── Text-to-Speech (P0-T011) ───
  flutter_tts: ^4.2.0

  # ─── Celebration Effects (P0-T012) ───
  confetti: ^0.7.0

  # ─── SVG Support (P0-T013) ───
  flutter_svg: ^2.0.9

  # ─── Sharing (P0-T014) ───
  share_plus: ^10.1.4

  # ─── Path Drawing (P0-T015) ───
  path_drawing: ^1.0.1

  # ─── Internationalization (P0-T016) ───
  intl: ^0.20.2

  # ─── Code Generation Annotations (P0-T017) ───
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # ─── Firebase Suite (P0-T018 to P0-T022) ───
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7

  # ─── Loading Shimmer (P0-T023) ───
  shimmer: ^3.0.0

  # ─── Existing Dependencies (kept) ───
  cupertino_icons: ^1.0.8
  purchases_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─── Code Generation (P0-T017) ───
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # ─── Assets (P0-T050) ───
  assets:
    # Letters — core identity (name, sound, positions)
    - assets/audio/letters/core/
    # Letters — short vowels (fatha, kasra, damma, sukoon) = phoneme layer
    - assets/audio/letters/short_vowels/
    # Letters — long vowels / mudud (maad) = blending layer
    - assets/audio/letters/long_vowels/
    # Letters — vocabulary words per letter
    - assets/audio/letters/words/
    # Letters — demo sentences and harakat demonstrations
    - assets/audio/letters/phrases/
    # Narrated stories and exploration audio
    - assets/audio/
    - assets/audio/stories/
    # Feedback & encouragement sounds (correct, try_again, excellent...)
    - assets/audio/feedback/
    # Game & activity instructions
    - assets/audio/instructions/
    - assets/audio/words_game/
    # UI sound effects
    - assets/audio/sfx/
